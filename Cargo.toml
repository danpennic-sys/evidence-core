[package]
name = "evidence_core"
version = "0.1.0"
edition = "2021"
description = "Minimal deterministic EvidencePack emission + verification for Operator microservices"
license = "MIT OR Apache-2.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"

[lib]
path = "src/lib.rs"
