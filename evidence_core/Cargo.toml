[package]
name = "evidence_core"
version.workspace = true
edition.workspace = true
description = "Minimal deterministic EvidencePack emission + verification for Operator microservices"
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
hex = "0.4"

[lib]
path = "src/lib.rs"
