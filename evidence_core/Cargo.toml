[package]
name = "evidence_core"
version.workspace = true
edition.workspace = true
description = "Minimal deterministic EvidencePack emission + verification for Operator microservices"
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"

[lib]
path = "src/lib.rs"
